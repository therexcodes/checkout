<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>REXCODES | Demo Checkout</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f4f5f7; color: #172033; font-family: system-ui, sans-serif; line-height: 1.5; }
    main { max-width: 960px; margin: 3rem auto; padding: 1rem; }
    .layout { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; }
    section, aside { background: white; padding: 1.5rem; border-radius: 16px; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select, button { font: inherit; width: 100%; padding: .75rem; border-radius: 8px; border: 1px solid #788398; }
    button { margin-top: 1.5rem; background: #244dc5; color: white; cursor: pointer; }
    :focus-visible { outline: 3px solid #a65a00; outline-offset: 3px; }
    .row { display: flex; justify-content: space-between; gap: 1rem; }
    .note { color: #48546b; }
    @media (max-width: 640px) { .layout { grid-template-columns: 1fr; } main { margin: 1rem auto; } }
  </style>
</head>
<body>
<main>
  <p>REXCODES STORE</p>
  <h1>Checkout</h1>
  <p class="note">Demo checkout. No payment is collected and no order is sent. Use sample information.</p>
  <div class="layout">
    <section aria-labelledby="details-heading">
      <h2 id="details-heading">Your details</h2>
      <form id="checkout">
        <label for="name">Full name</label>
        <input id="name" autocomplete="name" required maxlength="100">
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required maxlength="254">
        <label for="address">Delivery address</label>
        <input id="address" autocomplete="street-address" required maxlength="300">
        <label for="quantity">Notebook quantity</label>
        <select id="quantity">
          <option value="1">1</option><option value="2">2</option><option value="3">3</option>
        </select>
        <button id="place-order" type="submit" disabled>Place demo order</button>
        <noscript><p>Enable JavaScript to try this demo checkout.</p></noscript>
        <p id="message" role="status"></p>
      </form>
    </section>
    <aside aria-labelledby="summary-heading">
      <h2 id="summary-heading">Order summary</h2>
      <p>REXCODES Notebook · $24.00 each</p>
      <p class="row"><span>Subtotal</span><span id="subtotal">$24.00</span></p>
      <p class="row"><span>Demo shipping</span><span>$5.00</span></p>
      <hr>
      <p class="row"><strong>Total (USD)</strong><strong id="total">$29.00</strong></p>
      <p class="note">Sample prices. Taxes are excluded from this demo.</p>
    </aside>
  </div>
</main>
<script>
  const form = document.getElementById('checkout');
  const quantity = document.getElementById('quantity');
  const message = document.getElementById('message');
  const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
  function updateSummary() {
    const subtotalCents = Number(quantity.value) * 2400;
    document.getElementById('subtotal').textContent = money.format(subtotalCents / 100);
    document.getElementById('total').textContent = money.format((subtotalCents + 500) / 100);
  }
  form.addEventListener('input', () => { message.textContent = ''; });
  quantity.addEventListener('change', updateSummary);
  form.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!document.getElementById('name').value.trim() || !document.getElementById('address').value.trim()) {
      message.textContent = 'Please enter a name and delivery address containing more than spaces.';
      return;
    }
    message.textContent = 'Demo order confirmed. No payment was taken and no order was sent.';
  });
  updateSummary();
  document.getElementById('place-order').disabled = false;
</script>
</body>
</html>
